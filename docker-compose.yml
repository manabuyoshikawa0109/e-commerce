services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zzz-custom.ini:ro
      - ./docker/php/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
    depends_on:
      - db
    environment:
      # CakePHP の config/app.php から getenv('DATABASE_URL') で参照できる
      DATABASE_URL: "mysql://${MYSQL_USER:-cake}:${MYSQL_PASSWORD:-cakepass}@db/${MYSQL_DATABASE:-cake_app}?encoding=utf8&timezone=UTC&cacheMetadata=true"

  db:
    image: mysql:5.7
    # Apple Silicon (arm64) でも動くように amd64 エミュレーションで起動
    platform: linux/amd64
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-cake_app}"
      MYSQL_USER: "${MYSQL_USER:-cake}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-cakepass}"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
